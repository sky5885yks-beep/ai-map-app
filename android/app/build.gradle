plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

// 签名配置：从 android/key.properties 读取（本地保留，不提交仓库）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def haveReleaseKey = keystorePropertiesFile.exists()
if (haveReleaseKey) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.ai_map_app"
    compileSdkVersion 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.example.ai_map_app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // 发布签名：有 key.properties 用 release 签名，否则退回 debug（便于先出测试包）
    signingConfigs {
        release {
            if (haveReleaseKey) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig haveReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
        }
    }
}

flutter {
    source '../..'
}
