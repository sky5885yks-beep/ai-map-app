name: Build Android APK

# 手动触发或推送代码时自动构建
on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write   # 需要创建 Release 并上传 APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 设置 Java 17（Flutter 构建需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Flutter SDK
        # Flutter 的 gradle wrapper 二进制文件较大，不随源码提交，
        # 这里用 subosito 官方 action 安装 Flutter 后即可自动补齐
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 补齐 Android 脚手架并装入本项目源码
        run: |
          # 在临时目录生成一个标准 Flutter 工程，拿到 gradle wrapper / 脚本
          flutter create --project-name ai_map_app --org com.example scaff
          cd scaff
          # 用本项目的代码覆盖模板代码
          rm -rf lib && cp -r ../lib ./lib
          cp ../pubspec.yaml ./pubspec.yaml
          # 覆盖 Android 自定义配置
          cp ../android/settings.gradle ./android/settings.gradle
          cp ../android/build.gradle ./android/build.gradle
          cp ../android/gradle.properties ./android/gradle.properties
          cp ../android/key.properties.example ./android/key.properties.example
          cp ../android/app/build.gradle ./android/app/build.gradle
          cp -r ../android/app/src ./android/app/
          # 拉取依赖
          flutter pub get

      - name: 构建 Release APK
        working-directory: scaff
        run: flutter build apk --release

      - name: 重命名 APK
        run: cp scaff/build/app/outputs/flutter-apk/app-release.apk ai-map-v1.apk

      - name: 上传 APK 到 Release
        # 用 gh CLI 把 APK 作为 Release 资源上传，之后可用公开链接下载
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 \
            ai-map-v1.apk#ai-map-v1.apk \
            --title "AI 地图 v1.0.0" \
            --notes "V1：分类浏览 + 外部链接跳转，数据离线可看（快照 2026-11-23）" \
            || gh release upload v1.0.0 ai-map-v1.apk#ai-map-v1.apk --clobber
